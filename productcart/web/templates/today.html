{% extends "base.html" %}
{% block title %}Що приготувати сьогодні — Кошик з акцій{% endblock %}
{% block body %}
<form class="td vf" id="td" method="get" action="/today/dishes">
  <input type="hidden" name="have" id="tdHave" value="{{ have|join(',') }}">
  <input type="hidden" name="t" value="{{ t if request.query_params.get('t') else 60 }}">
  <input type="hidden" name="n" value="{{ n }}">
  <input type="hidden" name="k" value="{{ kit|join(',') }}">
  <div class="td-top"><a class="td-back" href="/" aria-label="Назад">←</a></div>
  <h1 class="vf-h" id="vfH">Скажіть, що є вдома</h1>
  <p class="vf-sub" id="vfSub">Наприклад: «курка, рис і трохи сиру»</p>
  <button type="button" class="vf-mic" id="vfMic" aria-label="Говорити">{{ ic("mic") }}</button>
  <p class="vf-hint" id="vfHint" aria-live="polite"></p>
  <div class="vf-chips" id="vfChips"></div>
  <div class="vf-type" id="vfType" hidden>{% include "_say.html" %}</div>
  <button type="button" class="vf-alt" id="vfAlt">{{ ic("keyboard", "sm") }} Написати або вибрати зі списку</button>
  <div class="vf-go"><button type="submit" class="btn" id="vfGo">Показати страви</button></div>
</form>
<script>
(function () {
  var form = document.getElementById('td'); if (!form) return;
  var $ = function (id) { return document.getElementById(id); };
  var WORDS = {{ words|tojson }}, typing = false;
  var say = window.initSay({ words: WORDS, have: {{ have|tojson }}, onChange: function (h, o) {
    $('tdHave').value = h.join(',');
    var box = $('vfChips'); if (!box) return; box.innerHTML = '';
    if (!typing) h.forEach(function (k) {
      var c = document.createElement('button'); c.type = 'button'; c.className = 'vf-chip';
      c.textContent = WORDS[k][1] + ' ' + WORDS[k][0]; c.setAttribute('aria-label', 'Прибрати: ' + WORDS[k][0]);
      c.onclick = function () { say.remove(k); if (window.haptic) haptic(8); }; box.appendChild(c);
    });
    var go = $('vfGo'); go.textContent = h.length ? 'Показати страви · ' + h.length : 'Показати будь-які страви';
    go.classList.toggle('alt', !h.length); go.classList.toggle('vf-quiet', !h.length);
  } });
  if (!say) return;
  // велика кнопка — та сама, що 🎤 у полі (дозволи, підказки, розбір фрази)
  $('vfMic').onclick = function () { $('hvMic').click(); };
  new MutationObserver(function () { $('vfMic').classList.toggle('on', $('hvMic').classList.contains('on')); })
    .observe($('hvMic'), { attributes: true, attributeFilter: ['class'] });
  // статус розпізнавання («Слухаю…», «Не почули») — під великою кнопкою
  var mirror = function () { $('vfHint').textContent = $('hvHint').dataset.touched ? $('hvHint').textContent : ''; };
  new MutationObserver(function () { $('hvHint').dataset.touched = '1'; mirror(); }).observe($('hvHint'), { childList: true, characterData: true, subtree: true });
  $('vfAlt').onclick = function () {
    typing = true; $('vfH').textContent = 'Що є вдома?'; $('vfSub').textContent = 'Пишіть через кому або оберіть з підказок'; $('vfType').hidden = false; $('vfAlt').hidden = true; form.classList.add('typing');
    say.add([]); $('hvIn').focus();
  };
  form.addEventListener('submit', function () { say.flush(); });
})();
</script>
{% endblock %}
