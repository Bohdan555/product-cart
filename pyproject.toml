[project]
name = "product-cart"
version = "0.1.0"
description = "Персональний список покупок з акцій мереж: профіль вподобань → підбір акцій → готовий список по магазинах"
requires-python = ">=3.11"
dependencies = [
  # Сайт і «Сільпо». Модулі ядра (models, catalog, matcher, planner, render) їх не імпортують.
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "cryptography>=42",
  "httpx>=0.27",
  "mcp>=1.12,<2",
  "psycopg[binary]>=3.2",
  # Розпізнавання фото холодильника (Claude через Vercel AI Gateway або Anthropic API)
  "anthropic>=2.8,<3",
]

[project.optional-dependencies]
# Офіційний MCP «Сільпо» (OAuth від імені покупця). SDK 2.x має інший API, тому фіксуємо 1.x.
silpo = ["mcp>=1.12,<2"]
web = ["fastapi>=0.115", "uvicorn>=0.30", "jinja2>=3.1", "python-multipart>=0.0.9", "cryptography>=42", "httpx>=0.27", "mcp>=1.12,<2", "psycopg[binary]>=3.2", "anthropic>=2.8,<3"]
dev = ["pytest>=8"]

[project.scripts]
productcart = "productcart.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["productcart*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.setuptools.package-data]
productcart = ["web/templates/*.html", "web/static/*", "web/static/dishes/*", "web/static/fonts/*", "web/static/vendor/*"]
