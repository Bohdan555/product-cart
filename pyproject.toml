[project]
name = "product-cart"
version = "0.1.0"
description = "Персональний список покупок з акцій мереж: профіль вподобань → підбір акцій → готовий список по магазинах"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Офіційний MCP «Сільпо» (OAuth від імені покупця). SDK 2.x має інший API, тому фіксуємо 1.x.
silpo = ["mcp>=1.12,<2"]
dev = ["pytest>=8"]

[project.scripts]
productcart = "productcart.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["productcart*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
